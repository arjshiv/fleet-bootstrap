# Better terminal fidelity.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,screen-256color:RGB,tmux-256color:RGB"

# General behavior.
set -g history-limit 100000
set -g escape-time 10
set -sg repeat-time 600
set -g display-time 3000
set -g focus-events on
set -g mouse on
setw -g mode-keys vi
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Keep names stable once you set them.
set -g allow-rename off
set -g automatic-rename off
set -g set-titles off

# Quieter notifications.
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Remap prefix from C-b to C-a.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes using symbols that match the layout.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config quickly after edits.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Pane resizing.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Faster window management.
bind c new-window -c "#{pane_current_path}"

# Theme.
setw -g clock-mode-colour colour81
setw -g mode-style "fg=colour232,bg=colour110,bold"
set -g message-style "fg=colour230,bg=colour31,bold"
set -g message-command-style "fg=colour230,bg=colour31,bold"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour81"

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-left-length 24
set -g status-right-length 80
set -g status-style "fg=colour248,bg=colour234"

set -g status-left "#[fg=colour81,bold] #S #[fg=colour239,nobold]|#[default]"
set -g status-right "#{?client_prefix,#[fg=colour232,bg=colour203,bold] PREFIX #[default] ,}#[fg=colour239]|#[fg=colour250] #H #[fg=colour239]|#[fg=colour110] %Y-%m-%d #[fg=colour81]%H:%M "

setw -g window-status-separator ""
setw -g window-status-style "fg=colour245,bg=colour234"
setw -g window-status-format " #[fg=colour245]#I #[fg=colour250]#W#{?window_zoomed_flag,#[fg=colour215] [Z],} "
setw -g window-status-current-format "#[fg=colour232,bg=colour81,bold] #I #W#{?window_zoomed_flag, [Z],} #[default]"
setw -g window-status-activity-style "fg=colour223,bg=colour234,bold"
setw -g window-status-bell-style "fg=colour232,bg=colour203,bold"
